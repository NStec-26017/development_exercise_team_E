<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>アカウント登録（確認）</title>
    <style>
        /* ベース設定（必要に応じて共通CSSに移動、または削除してください） */
        body {
            margin: 0;
            font-family: "Hiragino Kaku Gothic ProN", Meiryo, Arial, sans-serif;
            color: #222;
            background: #fff;
        }

        .wrap {
            min-height: 100vh;
            border: 1px solid #000;
            display: flex;
            flex-direction: column;
        }

        /* メイン（アカウント登録確認エリア専用スタイル） */
        main {
            flex: 1;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .box {
            width: 100%;
            max-width: 760px;
            text-align: center;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 28px;
            margin: 6px 0 30px;
        }

        .info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .row .label {
            width: 140px;
            text-align: right;
            font-size: 16px;
            color: #333;
        }

        .row .value {
            min-width: 160px;
            text-align: left;
            font-size: 16px;
        }

        /* パスワードの伏字を見やすくする */
        .pw {
            letter-spacing: 3px;
        }

        .btn-area {
            display: flex;
            justify-content: center;
            gap: 16px;
            align-items: center;
        }

        .link-cancel {
            color: #138a52;
            text-decoration: none;
            font-weight: 700;
        }

        .btn {
            border: 2px solid #138a52;
            color: #138a52;
            background: #fff;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn.primary {
            background: #138a52;
            color: #fff;
        }

        /* 小さい画面（スマホ）向けの調整 */
        @media (max-width:480px) {
            .row {
                flex-direction: column;
                gap: 6px;
            }

            .row .label {
                text-align: center;
                width: auto;
            }

            .row .value {
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <!-- 
      ※headerとfooterを共通のレイアウトテンプレート側で出力する場合は、
      実質以下の<main>タグの部分だけを切り取って流し込んでください。
    -->
    <div class="wrap">
        <main>
            <div class="box">
                <h1>アカウント登録(確認)</h1>

                <div class="info">
                    <div class="row">
                        <div class="label">社員名</div>
                        <div class="value">フルネス太郎</div>
                    </div>
                    <div class="row">
                        <div class="label">アカウント名</div>
                        <div class="value">fullness</div>
                    </div>
                    <div class="row">
                        <div class="label">パスワード</div>
                        <div class="value pw">*******</div>
                    </div>
                </div>

                <div class="btn-area">
                    <a href="#" class="link-cancel">キャンセル</a>
                    <button class="btn" onclick="history.back()">戻る</button>
                    <button class="btn primary" onclick="alert('登録しました（ダミー）')">登録</button>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
