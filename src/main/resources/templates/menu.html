<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>フルネス文具 管理画面</title>

    <style>
        body {

            margin: 0;

            font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;

            color: #222;

            background: #fff;

        }

        .wrap {

            border: 1px solid #000;

            min-height: 100vh;

        }

        header {

            text-align: center;

            padding-top: 8px;

        }

        .title {

            color: #2d8a57;

            font-weight: bold;

            font-size: 22px;

            margin-bottom: 10px;

        }

        nav {

            display: flex;

            justify-content: center;

            gap: 18px;

            padding-bottom: 10px;

            align-items: center;

            flex-wrap: wrap;

        }

        nav a {

            color: #2d8a57;

            text-decoration: none;

            font-weight: bold;

            font-size: 16px;

        }

        .logout {

            border: 2px solid #2d8a57;

            padding: 4px 14px;

            border-radius: 6px;

        }

        .green-line {

            height: 4px;

            background: #1a9b5d;

        }

        .menu-area {

            text-align: center;

            padding: 40px 20px 50px;

            min-height: 300px;

        }

        .menu-area h2 {

            font-size: 26px;

            margin: 0 0 25px;

        }

        .menu-image {

            width: 250px;

            height: 165px;

            object-fit: cover;

        }

        footer {

            text-align: center;

            padding: 25px 0 30px;

            color: #2d8a57;

            font-weight: bold;

            font-size: 18px;

        }
    </style>

</head>

<body>

    <div class="wrap">

        <!--ヘッダー-->
        <header>

            <div class="title">フルネス文具 管理画面</div>

            <nav>

                <a href="#">商品情報メンテナンス</a>

                <a href="#">商品カテゴリ登録</a>

                <a href="#">アカウント登録</a>

                <a href="#" class="logout">ログアウト</a>

            </nav>

        </header>

        <div class="green-line"></div>

        <main class="menu-area">

            <h2>メニュー</h2>

            <img src="Shop_Img1.jpeg" alt="メニュー画像" class="menu-image">

        </main>

        <div class="green-line"></div>

        <footer>

            Fullness Stationery

        </footer>

    </div>

</body>

</html>
