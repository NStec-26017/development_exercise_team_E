<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント登録</title>
    <style>
        /* ベース設定（必要に応じて共通CSSに移動、または削除してください） */
        body {
            margin: 0;
            font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            color: #222;
            background: #fff;
        }

        .wrap {
            border: 1px solid #000;
            min-height: 100vh;
        }

        /* メイン（アカウント登録入力エリア専用スタイル） */
        main {
            text-align: center;
            padding: 35px 20px 50px;
            min-height: 260px;
        }

        h1 {
            font-size: 30px;
            margin: 0 0 30px;
        }

        .form-row {
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .form-row label {
            width: 90px;
            text-align: right;
            font-size: 18px;
        }

        .form-row input,
        .form-row select {
            width: 190px;
            height: 30px;
            border: 1px solid #bbb;
            font-size: 16px;
            padding: 2px 6px;
            box-sizing: border-box;
        }

        .btn-area {
            margin-top: 25px;
        }

        .cancel {
            color: #18a35b;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            margin-right: 14px;
        }

        .done {
            border: 2px solid #18a35b;
            color: #18a35b;
            text-decoration: none;
            padding: 6px 18px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 18px;
            background: #fff;
            display: inline-block;
            /* リンクの余白とクリック判定を安定させるため追加 */
        }
    </style>
</head>

<body>
    <!-- 
      ※headerとfooterを共通のレイアウトテンプレート側で出力する場合は、
      実質以下の<main>タグの部分だけを切り取って流し込んでください。
    -->
    <div class="wrap">
        <main>
            <h1>アカウント登録(入力)</h1>

            <!--社員名プルダウン-->
            <div class="form-row">
                <label for="company">社員名</label>
                <select id="company">
                    <option>フルネス太郎</option> <!--データベース等の値と連動させる箇所-->
                    <option>フルネス花子</option> <!--データベース等の値と連動させる箇所-->
                </select>
            </div>

            <div class="form-row">
                <label for="account">アカウント名</label>
                <input type="text" id="account">
            </div>

            <div class="form-row">
                <label for="password">パスワード</label>
                <input type="password" id="password">
            </div>

            <div class="btn-area">
                <a href="#" class="cancel">キャンセル</a>
                <a href="#" class="done">完了</a>
            </div>
        </main>
    </div>
</body>

</html>
