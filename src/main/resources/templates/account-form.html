```
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント登録</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            color: #222;
            background: #fff;
        }

        .wrap {
            border: 1px solid #000;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding-top: 5px;
        }

        .title {
            color: #2b8a57;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 8px;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
            padding-bottom: 10px;
        }

        nav a {
            color: #2b8a57;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .logout {
            border: 2px solid #2b8a57;
            padding: 4px 14px;
            border-radius: 4px;
            background: #fff;
        }

        .green-line {
            height: 4px;
            background: #18a35b;
        }

        main {
            text-align: center;
            padding: 35px 20px 50px;
            min-height: 260px;
        }

        h1 {
            font-size: 30px;
            margin: 0 0 30px;
        }

        .form-row {
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .form-row label {
            width: 90px;
            text-align: right;
            font-size: 18px;
        }

        .form-row input,
        .form-row select {
            width: 190px;
            height: 30px;
            border: 1px solid #bbb;
            font-size: 16px;
            padding: 2px 6px;
            box-sizing: border-box;
        }

        .btn-area {
            margin-top: 25px;
        }

        .cancel {
            color: #18a35b;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            margin-right: 14px;
        }

        .done {
            border: 2px solid #18a35b;
            color: #18a35b;
            text-decoration: none;
            padding: 6px 18px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 18px;
            background: #fff;
        }

        footer {
            text-align: center;
            padding: 30px 0;
            color: #2b8a57;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <div class="title">フルネス文具 管理画面</div>
            <nav>
                <a href="#">商品情報メンテナンス</a>
                <a href="#">商品カテゴリ登録</a>
                <a href="#">アカウント登録</a>
                <a href="#" class="logout">ログアウト</a>
            </nav>
        </header>

        <div class="green-line"></div>

        <main>
            <h1>アカウント登録(入力)</h1>

            <!--社員名プルダウン-->>
            <div class="form-row">
                <label for="company">社員名</label>
                <select id="company">
                    <option>フルネス太郎</option> <!--ここ変える-->>
                    <option>フルネス花子</option> <!--ここ変える-->>
                </select>
            </div>

            <div class="form-row">
                <label for="account">アカウント名</label>
                <input type="text" id="account">
            </div>

            <div class="form-row">
                <label for="password">パスワード</label>
                <input type="password" id="password">
            </div>

            <div class="btn-area">
                <a href="#" class="cancel">キャンセル</a>
                <a href="#" class="done">完了</a>
            </div>
        </main>

        <div class="green-line"></div>

        <footer>
            Fullness Stationery
        </footer>
    </div>
</body>

</html>
```
