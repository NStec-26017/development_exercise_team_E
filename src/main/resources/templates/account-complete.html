<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>アカウント登録（完了）</title>
    <style>
        :root {
            /* 共通カラー（メインカラー）の定義 */
            --green: #138a52;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Hiragino Kaku Gothic ProN", Meiryo, Arial, sans-serif;
            color: #222;
            background: #fff;
        }

        .wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            border: 1px solid #000;
        }

        /* メイン（アカウント登録完了エリア専用スタイル） */
        main {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 0 16px;
        }

        h1 {
            font-size: 30px;
            margin: 0 0 18px;
        }

        p.msg {
            font-size: 18px;
            color: #333;
            margin: 0 0 30px;
        }

        .btns {
            display: inline-flex;
            gap: 14px;
        }

        .btn {
            border: 2px solid var(--green);
            color: var(--green);
            background: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn.primary {
            background: var(--green);
            color: #fff;
        }

        /* 小さい画面（スマホ）向けの調整 */
        @media(max-width:480px) {
            h1 {
                font-size: 22px;
            }

            p.msg {
                font-size: 16px;
            }

            .btn {
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>

    <div class="wrap">
        <main>
            <div class="card">
                <h1>アカウント登録(完了)</h1>


                <p class="msg">フルネス太郎さんのアカウントを <strong>fullness</strong> で作成しました。</p>

                <div class="btns">
                    <a href="#" class="btn">メニューへ</a>
                    <button class="btn" onclick="history.back()">入力に戻る</button>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
