<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フルネス文具 管理画面</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background: #f5f5f5;
        }

        .wrap {
            border: 1px solid #000;
            min-height: 100vh;
            background: #eee;
        }

        /* ここが1枚目みたいなヘッダー */
        header {
            position: relative;
            text-align: center;
            padding: 20px 0 18px;
            background: #eee;
        }

        .title {
            color: #2d8a57;
            font-size: 22px;
            font-weight: bold;
        }

        .login-btn {
            position: absolute;
            right: 25px;
            top: 18px;
            color: #2d8a57;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #2d8a57;
            padding: 8px 22px;
            border-radius: 4px;
            background: #fff;
        }

        .green-line {
            height: 4px;
            background: #14995a;
        }

        main {
            text-align: center;
            padding: 40px 20px 50px;
            min-height: 280px;
            background: #eee;
        }

        main h2 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .menu-image {
            width: 250px;
            height: auto;
        }

        footer {
            text-align: center;
            padding: 25px 0 30px;
            color: #2d8a57;
            font-size: 18px;
            font-weight: bold;
            background: #eee;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <div class="title">フルネス文具 管理画面</div>
            <a href="#" class="login-btn">ログイン</a>
        </header>

        <div class="green-line"></div>

        <main>
            <h2>メニュー</h2>
            <img src="sample.jpg" alt="メニュー画像" class="menu-image">
        </main>

        <div class="green-line"></div>

        <footer>
            Fullness Stationery
        </footer>
    </div>
</body>

</html>
