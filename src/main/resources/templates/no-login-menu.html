<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共通ヘッダーパーツ</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background: #f5f5f5;
        }

        .wrap {
            border: 1px solid #000;
            background: #eee;
        }

        /* ヘッダー専用のスタイル */
        header {
            position: relative;
            text-align: center;
            padding: 20px 0 18px;
            background: #eee;
        }

        .title {
            color: #2d8a57;
            font-size: 22px;
            font-weight: bold;
        }

        .login-btn {
            position: absolute;
            right: 25px;
            top: 18px;
            color: #2d8a57;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #2d8a57;
            padding: 8px 22px;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            /* クリック可能なことが分かりやすいように追加 */
        }

        .green-line {
            height: 4px;
            background: #14995a;
        }
    </style>
</head>

<body>



    <header>
        <div class="title">フルネス文具 管理画面</div>
        <a href="/admin/login" class="login-btn">ログイン</a>
    </header>

    <div class="green-line"></div>

</body>

</html>
