<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品検索</title>
    <style>
        /* ベース設定（必要に応じて共通CSSに移動、または削除してください） */
        body {
            margin: 0;
            font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            color: #222;
            background: #fff;
        }

        .wrap {
            min-height: 100vh;
            border: 1px solid #000;
        }

        /* メイン（商品検索エリア専用スタイル） */
        main {
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 25px;
        }

        .search-area {
            margin-bottom: 20px;
        }

        select,
        button {
            height: 26px;
            font-size: 14px;
        }

        button {
            padding: 0 10px;
            cursor: pointer;
        }

        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 420px;
            background: #fff;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 6px;
            text-align: center;
            vertical-align: middle;
            writing-mode: horizontal-tb;
            text-orientation: mixed;
            white-space: nowrap;
        }

        th {
            background: #f5f5f5;
            font-weight: bold;
        }

        td.imgcell {
            width: 90px;
            height: 90px;
        }

        td.imgcell img {
            width: 80px;
            height: auto;
        }

        .btn-small {
            font-size: 12px;
            padding: 2px 8px;
        }

        .pager {
            margin-top: 18px;
            color: #1b8f57;
            font-weight: bold;
        }

        .pager a {
            color: #1b8f57;
            text-decoration: none;
            margin: 0 4px;
        }
    </style>
</head>

<body>
    <!-- 
      ※headerとfooterを共通のレイアウトテンプレート側で出力する場合は、
      実質以下の<main>タグの部分だけを切り取って流し込んでください。
    -->
    <div class="wrap">
        <main>
            <h1>商品検索</h1>

            <div class="search-area">
                <select>
                    <option>文房具</option>
                    <option>雑貨</option>
                    <option>パソコン周辺機器</option>
                </select>
                <button>カテゴリ検索</button>
                <button>商品追加</button>
            </div>

            <table>
                <tr>
                    <th>商品画像</th>
                    <th>商品名</th>
                    <th>単価</th>
                    <th>修正</th>
                    <th>削除</th>
                </tr>

                <tr>
                    <td class="imgcell">
                        <img src="black_pen_w.jpg" alt="黒いペン">
                    </td>
                    <td>水性ボールペン(黒)</td>
                    <td>120円</td>
                    <td><button class="btn-small">修正</button></td>
                    <td><button class="btn-small">削除</button></td>
                </tr>

                <tr>
                    <td class="imgcell">
                        <img src="red_pen_w.jpg" alt="赤いペン">
                    </td>
                    <td>水性ボールペン(赤)</td>
                    <td>120円</td>
                    <td><button class="btn-small">修正</button></td>
                    <td><button class="btn-small">削除</button></td>
                </tr>

                <tr>
                    <td class="imgcell">
                        <img src="blue_pen_w.jpeg" alt="青いペン">
                    </td>
                    <td>水性ボールペン(青)</td>
                    <td>120円</td>
                    <td><button class="btn-small">修正</button></td>
                    <td><button class="btn-small">削除</button></td>
                </tr>
            </table>

            <div class="pager">
                <a href="#">最初</a>
                <a href="#">前へ</a>
                <a href="#">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>
                <a href="#">6</a>
                <a href="#">7</a>
                <a href="#">8</a>
                <a href="#">9</a>
                <a href="#">次へ</a>
                <a href="#">最後</a>
            </div>
        </main>
    </div>
</body>

</html>
