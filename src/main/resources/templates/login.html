<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>フルネス文具 管理画面 - ログイン</title>
    <style>
        body {
            margin: 0;
            font-family: "Hiragino Kaku Gothic ProN", Meiryo, Arial, sans-serif;
            color: #222;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background: #fff;
            position: relative;
        }

        .title {
            color: #138a52;
            font-weight: 700;
            font-size: 20px;
            text-align: center;
            flex: 1;
        }

        .spacer {
            width: 120px;
        }

        /* 左側の余白用 */
        .login-btn {
            border: 2px solid #138a52;
            color: #138a52;
            background: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }

        .green-line {
            height: 4px;
            background: #138a52;
        }

        /* メイン（ログイン） */
        main {
            flex: 1;
            background: #fff;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        h1 {
            margin: 10px 0 30px;
            font-size: 28px;
        }

        form {
            display: block;
        }

        .row {
            margin: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .row label {
            width: 90px;
            text-align: right;
            margin-right: 10px;
            font-size: 15px;
        }

        .row input {
            width: 190px;
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        .submit {
            margin-top: 18px;
            display: inline-block;
            border: 2px solid #138a52;
            color: #138a52;
            padding: 8px 18px;
            border-radius: 6px;
            background: #fff;
            text-decoration: none;
            font-weight: 600;
        }

        /* フッター */
        footer {
            background: #fff;
            padding: 22px 10px;
            text-align: center;
            color: #138a52;
            font-weight: 700;
        }

        /* 小さい画面向け */
        @media (max-width:480px) {
            .row label {
                display: none;
            }

            .row input {
                width: 70%;
            }

            .spacer {
                width: 60px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="spacer"></div>
            <div class="title">フルネス文具 管理画面</div>
            <a href="#" class="login-btn">ログイン</a>
        </header>

        <div class="green-line"></div>

        <main>
            <div class="card">
                <h1>ログイン</h1>
                <form action="#" method="post">
                    <div class="row">
                        <label for="user">アカウント名</label>
                        <input id="user" name="user" type="text" required>
                    </div>
                    <div class="row">
                        <label for="pass">パスワード</label>
                        <input id="pass" name="pass" type="password" required>
                    </div>
                    <div style="text-align:center;">
                        <button class="submit" type="submit">ログイン</button>
                    </div>
                </form>
            </div>
        </main>

        <div class="green-line"></div>

        <footer>Fullness Stationery</footer>
    </div>
</body>

</html>
